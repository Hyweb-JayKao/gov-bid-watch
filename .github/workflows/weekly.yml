name: Weekly fetch (pcc-tender via TwinkleAI)

# 資料源已從 g0v 換成 TwinkleAI pcc-tender（scripts/fetch_pcc.py）。
# g0v 會擋 GitHub Actions IP（403）→ 當初停用改本機 launchd；
# pcc-tender 走 TwinkleAI endpoint（api.twinkleai.tw，非 g0v Cloudflare）→ Actions 可跑。
#
# ⚠️ 啟用前置：到 repo Settings → Secrets and variables → Actions
#    新增 secret  TWINKLE_API_KEY = sk-xxxx
#
# schedule 預設「註解停用」：先用 workflow_dispatch 手動跑一次確認 Actions IP
# 沒被 TwinkleAI 擋、且 merge/commit 正常，再取消下面 schedule 的註解啟用自動排程。
# （啟用 Actions 後，本機 launchd 二擇一，避免兩邊都寫 bids.csv 撞 commit）

on:
  schedule:
    - cron: "0 0 * * 1"  # 每週一 08:00 台北（手動 dispatch 驗證成功後啟用）
  workflow_dispatch:
    inputs:
      days:
        description: "抓取天數（預設 14；pcc 為半月公開資料，14 天確保重疊）"
        default: "14"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch bids (pcc-tender)
        env:
          TWINKLE_API_KEY: ${{ secrets.TWINKLE_API_KEY }}
        run: |
          if [ -z "$TWINKLE_API_KEY" ]; then
            echo "::error::缺 secret TWINKLE_API_KEY（Settings → Secrets → Actions）"
            exit 1
          fi
          DAYS="${{ github.event.inputs.days || '14' }}"
          python scripts/fetch_pcc.py --days "$DAYS" --out data/weekly.csv

      - name: Merge to master
        run: python scripts/merge.py --weekly data/weekly.csv --master data/bids.csv

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bids.csv
          git diff --cached --quiet || git commit -m "data: weekly update $(date -u +%Y-%m-%d) (pcc-tender)"
          git push
