name: Daily P0 watcher (pcc-tender → Slack)

# loop engineering pilot（issue #14）：每日 fetch → merge → P0 watcher → Slack 推播。
#
# ⚠️ 啟用前置（人類動作，pilot 期留 Jay）：
#   1. repo Settings → Secrets → Actions 新增：
#        TWINKLE_API_KEY = sk-xxxx
#        SLACK_WEBHOOK_URL = https://hooks.slack.com/...   ← Jay 設，確認 payload 格式後才填
#   2. 確認 dry-run dispatch 跑通、payload 格式 OK 後，
#      才把 watcher step 的 --push 打開 + 取消 schedule 註解。
#
# schedule 預設「註解停用」：先 workflow_dispatch 手動驗。
# Slack 預設 dry-run（不傳 --push）→ 只印 payload 不推真頻道，符合 #14 checkpoint。

on:
  schedule:
    - cron: "0 0 * * *"   # 每日 08:00 台北（2026-06-13 啟用：webhook 已設 + P0 收緊勞務類）
  workflow_dispatch:
    inputs:
      batches:
        description: "抓最新 N 個發布批次（預設 3；issue #22 方案 A 批次錨）"
        default: "3"
      push:
        description: "實際推 Slack？（true=推，預設 false=dry-run）"
        default: "false"

# #3 併發保護（issue #22）：schedule 與 manual dispatch 同時跑會各推一次 Slack、
# 且兩輪各自讀寫 watcher_state.json 造成節流失效 / 水位競態。同一 workflow 同時
# 只允許一輪；後到者排隊（不取消正在跑的，避免半途中斷推播/水位寫入）。
concurrency:
  group: daily-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # job 級硬時間封頂；watcher step 另設 5 分鐘細粒度封頂
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch (pcc-tender)
        env:
          TWINKLE_API_KEY: ${{ secrets.TWINKLE_API_KEY }}
        run: |
          if [ -z "$TWINKLE_API_KEY" ]; then
            echo "::error::缺 secret TWINKLE_API_KEY"; exit 1
          fi
          # issue #22 方案 A：官方天生 ~2 月延遲 + 半月批次發布 → 用「最新批次」抓，
          # 不再用 --days 公告日窗（對永遠落後 2 月的源結構性抓不到、天天 0 筆）。
          BATCHES="${{ github.event.inputs.batches || '3' }}"
          python scripts/fetch_pcc.py --latest-batches "$BATCHES" --out data/weekly.csv

      - name: Merge to master
        run: python scripts/merge.py --weekly data/weekly.csv --master data/bids.csv

      - name: P0 watcher (diff → P0 → 封頂 → Slack)
        # 時間封頂在此 step 硬 kill（取代 watcher.py 已移除的軟檢查；ADR D4）。
        # diff/P0 純記憶體操作極快，5 分鐘足夠；超時即 fail 喊人。
        timeout-minutes: 5
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # schedule 觸發（每日自動）→ 真推；手動 dispatch → 看 input（預設 dry-run）
          PUSH="${{ github.event.inputs.push || (github.event_name == 'schedule' && 'true' || 'false') }}"
          # --master 開啟資料新鮮度檢查（issue #22）：上游斷糧時即使 0 筆也推 Slack 告警
          ARGS="--weekly data/weekly.csv --state data/watcher_state.json --master data/bids.csv"
          if [ "$PUSH" = "true" ]; then ARGS="$ARGS --push"; fi
          # watcher capped 回 exit 2 → 標記但不讓整個 job 失敗（降級是正常路徑；
          # 時間封頂改靠本 step timeout-minutes 硬 kill，不再經 exit 2）
          python scripts/watcher.py $ARGS || ec=$?
          if [ "${ec:-0}" = "2" ]; then
            echo "::warning::watcher 觸發成本封頂/超時降級（見 data/alerts/）"
          elif [ "${ec:-0}" != "0" ]; then
            exit "$ec"
          fi

      # 任一前置 step 失敗 → 寫失敗告警 alert（消滅靜默失敗）。
      # 退出碼 0 不再連鎖失敗；alert markdown 隨下方 commit step 進 repo（留痕）。
      # 心跳：notify_failure 讀 watcher_state.last_run，連續 ≥3 天無成功 → 升級 high。
      - name: 失敗告警（寫 alert）
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python scripts/notify_failure.py \
            --reason "daily watcher run 失敗（fetch/merge/watcher 任一 step）" \
            --run-url "$RUN_URL" \
            --state data/watcher_state.json \
            --out-dir data/alerts

      # always()：即便前面失敗也要把 state / alert 提交留痕（含失敗告警 md）。
      # ⚠️ push 失敗「不可隱形」（codex high）：若有東西 commit 了卻 push 不上去，
      # 告警/state watermark 沒進 repo → 下輪拿舊 state 重算、失敗證據遺失。
      # 故 push 失敗時讓本 job 紅燈，不再 `|| true` 吞掉。
      # 容錯：先 rebase 重試（吸收併發 non-fast-forward），仍失敗才 fail。
      - name: Commit state + master + alerts
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bids.csv data/watcher_state.json data/alerts 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "沒有需要提交的變更，略過 push。"
            exit 0
          fi
          git commit -m "watcher: daily run $(date -u +%Y-%m-%dT%H:%M) (state/runlog/alert)"
          # push 重試：non-fast-forward 時 rebase 後再推，最多 3 次；全失敗 → 紅燈喊人。
          for attempt in 1 2 3; do
            if git push; then
              echo "push 成功（第 $attempt 次嘗試）。"
              exit 0
            fi
            echo "::warning::push 第 $attempt 次失敗，rebase 後重試…"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error::state/alert push 連續 3 次失敗——告警與 watcher_state 未進 repo，本 job 判定失敗（不靜默）。"
          exit 1
